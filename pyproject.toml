[project]
name = "horae-plugin-calendar"
version = "0.1.2"
description = "The calendar Horae plugin: calendar events from ICS feeds, recurrences expanded."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "horae-sdk>=0.9,<0.10",
    "httpx>=0.28.1,<1",
    "icalendar>=7.3,<8",
    "python-dateutil>=2.9,<3",
    "recurring-ical-events>=3.8.2,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horae_calendar"]

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7",
    "ruff>=0.17",
    "trustme>=1.2",
    "types-pyyaml>=6",
]

[tool.uv]
required-version = ">=0.13"
# No exclude-newer here: `horae plugin add` runs `uv sync --locked --no-config`, which ignores
# this table, so a lock resolved with it would not match (horae-dev/horae#199). The 7-day
# cooldown on new releases is Renovate's minimumReleaseAge (renovate.json).

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# recurring-ical-events and python-dateutil ship no type information.
module = ["recurring_ical_events", "recurring_ical_events.*", "dateutil", "dateutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["horae_calendar"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
